name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "release/**"

permissions:
  contents: read

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Biome
        run: npm run ci

      - name: Type check
        run: npm run typecheck

      - name: Test with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

  compatibility:
    name: Node.js ${{ matrix.node-version }} package compatibility
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 20
          - 22
          - 24

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Pack package
        run: |
          mkdir -p /tmp/dugble-package-smoke
          npm pack --pack-destination /tmp/dugble-package-smoke

      - name: Install packed package
        working-directory: /tmp/dugble-package-smoke
        run: |
          npm init -y
          npm install ./dugble-sdk-*.tgz

      - name: Verify ESM import
        working-directory: /tmp/dugble-package-smoke
        run: |
          node --input-type=module -e 'import { Dugble } from "@dugble/sdk"; if (typeof Dugble !== "function") process.exit(1)'

      - name: Verify CommonJS require
        working-directory: /tmp/dugble-package-smoke
        run: |
          node -e 'const { Dugble } = require("@dugble/sdk"); if (typeof Dugble !== "function") process.exit(1)'
